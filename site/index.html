/* ============================================================ relatório
   Gera automaticamente, pelo período selecionado, um relatório no padrão Scale:
   visual + textos em linguagem simples + insights/gargalos. Botão copia o texto. */

/* Métricas agregadas por NOME de anúncio (tráfego), somando todas as veiculações. */
function adsByName(from, to){
  const tax = DATA.meta.tax, map = new Map();
  const g = a => { let n = map.get(a); if (!n){ n = Object.assign(blank(), {label:a}); map.set(a, n); } return n; };
  for (const r of DATA.ads) if (r.d >= from && r.d <= to && inSel(r)) accAd(g(r.a), r, tax);
  for (const s of DATA.sales) if (s.d >= from && s.d <= to && isTraffic(s) && s.m === "ad" && inSel(s)) accSale(g(s.a), s);
  return [...map.values()].map(derive).filter(a => a.spend > 0 || a.sales > 0);
}

function renderReport(){
  const {from, to} = STATE, days = diffDays(from, to) + 1;
  const pTo = addDays(from, -1), pFrom = addDays(pTo, -(days-1));
  const sm = STATE.mode;
  STATE.mode = "traffic";
  const cur = aggregate(from, to), prev = aggregate(pFrom, pTo);
  const dRows = daily(from, to), tree = buildTree(from, to);
  STATE.mode = sm;
  const ads = adsByName(from, to);
  const regions = groupByRegion(from, to).filter(r => r.spend > 0 || r.sales > 0).sort((a,b) => b.spend - a.spend);
  const T = CAC_GOAL;
  const perLabel = days === 1 ? dayFull(from) : `${dayFull(from)} a ${dayFull(to)} · ${days} dias`;
  const over = cur.cac != null && cur.cac > T;
  const cpl = c => c == null || !isFinite(c) ? "—" : `<b style="color:${c <= T ? "var(--good-text)" : "var(--critical)"}">${M.money(c)}</b>`;

  /* tabela diária de leads — 10 linhas + rolagem + resumo (igual à aba principal) */
  const dailyLeadTbl = rows => {
    const rr = rows.filter(r => r.spend > 0 || r.sales > 0).reverse();
    const head = DLEAD.map(c => `<th title="${c.hint || ""}">${c.label}</th>`).join("");
    const body = rr.map(r => `<tr>${DLEAD.map(c => c.k === "d" ? `<td>${dayFull(r.d)}</td>` : `<td>${c.fmt(r[c.k])}</td>`).join("")}</tr>`).join("");
    const tot = derive(rr.reduce((t,r) => { for (const k of RAW) t[k] += (r[k] || 0); return t; }, blank()));
    const foot = DLEAD.map(c => c.k === "d" ? `<td>Resumo · ${rr.length} dia(s)</td>` : `<td>${c.fmt(tot[c.k])}</td>`).join("");
    return `<div class="tblwrap dscroll"><table class="daily"><thead><tr>${head}</tr></thead>`
      + `<tbody>${body || `<tr><td colspan="${DLEAD.length}" style="text-align:center;color:var(--ink-3)">Sem dias com atividade.</td></tr>`}</tbody>`
      + `<tfoot><tr>${foot}</tr></tfoot></table></div>`;
  };
  const grpTbl = (rows, first, firstOf) => `<div class="tblwrap dscroll"><table class="daily"><thead><tr>`
    + `<th>${first}</th><th>Investimento</th><th>Leads</th><th>CPL</th><th>Leads Qualif.</th><th>CPL Qualif.</th><th>Tx. Qualif.</th></tr></thead>`
    + `<tbody>${rows.map(r => `<tr><td>${escape_(firstOf(r))}</td><td>${M.money(r.spend)}</td><td>${int(r.sales)}</td><td>${cpl(r.cac)}</td><td>${int(r.salesQ)}</td><td>${M.money(r.cplQual)}</td><td>${M.pct1(r.txQual)}</td></tr>`).join("")
      || `<tr><td colspan="7" style="text-align:center;color:var(--ink-3)">Sem dados no período.</td></tr>`}</tbody></table></div>`;

  /* =================== SEÇÕES VISUAIS (limpas — prontas pro print) =================== */
  const secVisual = `
    <div class="rep-sec">
      <div class="step">1 · VISÃO GERAL</div>
      <h3>🎯 Funil de captação no período</h3>
      <div class="rep-stats">
        ${repStat("Investimento", M.money(cur.spend))}
        ${repStat("Leads", int(cur.sales))}
        ${repStat("CPL", cpl(cur.cac))}
        ${repStat("Leads qualificados", int(cur.leadsQ))}
        ${repStat("CPL qualificado", M.money(cur.cplQual))}
        ${repStat("Tx. qualificação", M.pct1(cur.txQual))}
      </div>
      <p class="rep-p">Meta de CPL: <b>${M.money(T)}</b> · CTR ${M.pct1(cur.ctr)} · CPC ${M.money(cur.cpc)} · CPM ${M.money(cur.cpm)} · Tx. conversão do formulário (lead ÷ clique) ${M.pct1(cur.txForm)}. Lead qualificado = respondeu “sim” ao investimento mínimo de R$ 50 mil.</p>
    </div>
    <div class="rep-sec">
      <div class="step">2 · DIA A DIA</div>
      <h3>📅 Captação dia a dia</h3>
      ${dailyLeadTbl(dRows)}
    </div>
    <div class="rep-sec">
      <div class="step">3 · REGIÕES</div>
      <h3>📍 Resumo por praça</h3>
      ${grpTbl(regions, "Região", r => r.region)}
    </div>
    <div class="rep-sec">
      <div class="step">4 · CAMPANHAS</div>
      <h3>🗂️ Campanhas</h3>
      ${grpTbl(tree.camps.filter(c => c.spend > 0).sort((a,b) => b.spend - a.spend), "Campanha", c => c.label)}
    </div>
    <div class="rep-sec">
      <div class="step">5 · MELHORES ANÚNCIOS</div>
      <h3>🏆 Destaques (mais leads, menor CPL)</h3>
      ${(() => {
        const b = ads.filter(a => a.sales > 0).sort((a,z) => (z.sales - a.sales) || (a.cac - z.cac)).slice(0, 6);
        return b.length ? b.map(a => `<div class="rep-ad">
          <div><span class="nm">${escape_(a.label)}</span> <span class="mt">· ${int(a.sales)} leads · CPL ${M.money(a.cac)} · ${int(a.leadsQ)} qualif. · ${M.money(a.spend)} investidos</span></div>
          <input data-adlink="${encodeURIComponent(a.label)}" placeholder="cole o link do anúncio (Instagram)">
        </div>`).join("") : `<p class="rep-p muted">Sem leads atribuídos a um anúncio específico no período.</p>`;
      })()}
    </div>`;

  /* =================== BRIEFING DO GESTOR (interno, base LEADS) =================== */
  const brief = [];
  const nf = v => v == null || !isFinite(v) ? "—" : nf1.format(v);
  const gap = cur.cac != null ? cur.cac - T : null;
  const clkPerLead = div(cur.clk, cur.sales);
  const cpcCeil = (cur.txForm != null && isFinite(cur.txForm)) ? T * cur.txForm : null; // CPC que a meta de CPL comporta na conversão atual

  // leitura geral
  const xGeral = cur.sales === 0 ? "Sem leads no período — só investimento."
    : `Investimento ${M.money(cur.spend)} gerou ${int(cur.sales)} leads a CPL ${M.money(cur.cac)} (meta ${M.money(T)}, ${over ? `+${M.money(gap)} acima` : `${M.money(-gap)} de folga`}). `
      + `Desses, ${int(cur.leadsQ)} são qualificados (${M.pct1(cur.txQual)}), a CPL qualificado ${M.money(cur.cplQual)}. `
      + (prev.cac != null && isFinite(prev.cac) ? `Vs período anterior o CPL ${cur.cac < prev.cac ? "caiu" : "subiu"} de ${M.money(prev.cac)}.` : "");
  brief.push({t:"Leitura geral", h:`<p>${xGeral}</p>`, x:xGeral});

  // decomposição do CPL
  const convNeeded = (cur.cpc != null && cur.cpc > 0) ? cur.cpc / T : null;
  let xCpl = cur.sales === 0 ? "Sem leads — sem CPL pra avaliar."
    : `Cada lead custou ~${nf(clkPerLead)} cliques a ${M.money(cur.cpc)} cada (CTR ${M.pct1(cur.ctr)}, CPM ${M.money(cur.cpm)}). `
      + (over && cpcCeil != null ? `Pra bater a meta sem mexer na conversão, o CPC precisa cair pra ${M.money(cpcCeil)} — OU, mantendo o CPC, a conversão clique→lead subir de ${M.pct1(cur.txForm)} pra ${M.pct1(convNeeded)}.`
        : !over ? `Há folga no CPL: dá pra escalar de olho pra CPC/conversão não piorarem.` : "");
  brief.push({t:"Decomposição do CPL", h:`<p>${xCpl}</p>`, x:xCpl});

  // dia a dia
  const ds = dRows.filter(r => r.sales > 0);
  let xDia;
  if (ds.length){
    const best = ds.reduce((a,b) => b.cac < a.cac ? b : a);
    const worst = ds.reduce((a,b) => b.cac > a.cac ? b : a);
    const mid = Math.ceil(ds.length/2);
    const wavg = arr => { const s = arr.reduce((x,r) => x + r.spend, 0), v = arr.reduce((x,r) => x + r.sales, 0); return v > 0 ? s/v : null; };
    const early = wavg(ds.slice(0, mid)), late = wavg(ds.slice(mid));
    const trend = (early != null && late != null && ds.length >= 3) ? (late < early ? "CPL vem caindo nos dias recentes (bom)." : late > early ? "CPL subiu nos dias recentes (de olho)." : "CPL estável.") : "";
    xDia = `Melhor dia ${dayFull(best.d)} (CPL ${M.money(best.cac)}, ${int(best.sales)} leads) · pior ${dayFull(worst.d)} (CPL ${M.money(worst.cac)}). ${trend}`;
  } else xDia = "Sem leads dia a dia no período.";
  brief.push({t:"Dia a dia", h:`<p>${xDia}</p>`, x:xDia});

  // regiões — melhores e piores praças
  let xReg;
  if (regions.length){
    const withLeads = regions.filter(r => r.sales > 0);
    const bestR = withLeads.slice().sort((a,b) => a.cac - b.cac).slice(0,3);
    const worstR = withLeads.filter(r => r.cac != null && r.cac > T).sort((a,b) => b.spend - a.spend).slice(0,3);
    const noLead = regions.filter(r => r.spend >= T && r.sales === 0).sort((a,b) => b.spend - a.spend).slice(0,3);
    xReg = `Praças mais eficientes: ${bestR.map(r => `${r.region} (CPL ${M.money(r.cac)}, ${int(r.sales)} leads, ${M.pct1(r.txQual)} qualif.)`).join("; ") || "—"}. `
      + (worstR.length ? `Caras (CPL acima da meta): ${worstR.map(r => `${r.region} (${M.money(r.cac)})`).join("; ")}. ` : "")
      + (noLead.length ? `Gastaram sem lead: ${noLead.map(r => `${r.region} (${M.money(r.spend)})`).join("; ")}.` : "");
  } else xReg = "Sem dados de região no período.";
  brief.push({t:"Regiões", h:`<p>${xReg}</p>`, x:xReg});

  // campanhas — o que fazer
  const active = tree.camps.filter(c => c.spend > 0);
  const scale = active.filter(c => c.cac != null && c.cac <= T && c.sales >= 2).sort((a,b) => a.cac - b.cac);
  const cut   = active.filter(c => c.spend >= T && (c.sales === 0 || (c.cac != null && c.cac > 1.5*T))).sort((a,b) => b.spend - a.spend);
  const watch = active.filter(c => !scale.includes(c) && !cut.includes(c)).sort((a,b) => b.spend - a.spend);
  const line = (c, extra) => `<li><b>${escape_(c.label)}</b> — ${M.money(c.spend)} investidos, ${int(c.sales)} leads, CPL ${cpl(c.cac)}, ${M.pct1(c.txQual)} qualif. ${extra}</li>`;
  const campHtml = `
    ${scale.length ? `<p><span class="rep-flag g">ESCALAR</span> CPL dentro da meta e com volume:</p><ul>${scale.slice(0,5).map(c => line(c, "tem espaço pra mais verba.")).join("")}</ul>` : ""}
    ${cut.length ? `<p style="margin-top:10px"><span class="rep-flag r">CORTAR / REVISAR</span> drenando verba (CPL alto ou sem lead):</p><ul>${cut.slice(0,5).map(c => line(c, c.sales === 0 ? "gastou e não gerou lead — candidata a pausar." : "CPL muito acima da meta — revisar público/criativo.")).join("")}</ul>` : ""}
    ${watch.length ? `<p style="margin-top:10px"><span class="rep-flag y">OBSERVAR</span> pouco volume/gasto:</p><ul>${watch.slice(0,4).map(c => line(c, "esperar mais dado ou dar um empurrão pequeno.")).join("")}</ul>` : ""}
    <p class="rep-p muted" style="margin-top:8px">Não sei o que você já pausou — é um raio-x do momento pra você decidir onde mexer.</p>`;
  const campX = `Escalar: ${scale.slice(0,5).map(c => c.label + " (CPL " + M.money(c.cac) + ")").join("; ") || "—"}.\nCortar/revisar: ${cut.slice(0,5).map(c => c.label + " (" + M.money(c.spend) + ", " + int(c.sales) + " leads)").join("; ") || "—"}.\nObservar: ${watch.slice(0,4).map(c => c.label).join("; ") || "—"}.`;
  brief.push({t:"Campanhas — o que fazer", h:campHtml, x:campX});

  // anúncios — queimando × promissores
  const ins = [];
  const burning = ads.filter(a => a.spend >= T && (a.sales === 0 || (a.cac != null && a.cac > 2*T))).sort((a,b) => b.spend - a.spend).slice(0, 4);
  burning.forEach(a => ins.push(["🔥", `<b>Queimando verba:</b> "${escape_(a.label)}" investiu ${M.money(a.spend)} e ${a.sales === 0 ? "não gerou lead" : `só ${int(a.sales)} lead(s) (CPL ${M.money(a.cac)})`} — candidato a pausar.`]));
  const promising = ads.filter(a => a.sales > 0 && a.cac != null && a.cac < T*0.8).sort((a,b) => a.cac - b.cac).slice(0, 4);
  promising.forEach(a => ins.push(["⭐", `<b>Pode surpreender:</b> "${escape_(a.label)}" CPL ${M.money(a.cac)} com ${int(a.sales)} lead(s) (${int(a.leadsQ)} qualif.) e só ${M.money(a.spend)} — colocar mais verba e criar variações.`]));
  if (cur.txQual != null) ins.push([cur.txQual >= 0.7 ? "✅" : "⚠️", `<b>Qualificação:</b> ${M.pct1(cur.txQual)} dos leads dizem ter os R$ 50 mil (${int(cur.leadsQ)} de ${int(cur.sales)}). CPL qualificado ${M.money(cur.cplQual)}.`]);
  ins.push(["🧭", over
    ? `<b>Resumo:</b> CPL um pouco acima da meta. Cortar o que queima verba, escalar as praças/campanhas eficientes e melhorar CPC/conversão deve trazer pra dentro.`
    : `<b>Resumo:</b> CPL na meta. Momento de escalar com cuidado mantendo o custo e a qualificação.`]);
  const insHtml = `<div>${ins.map(i => `<div class="insight"><span class="ico">${i[0]}</span><span class="tx">${i[1]}</span></div>`).join("")}</div>`;
  brief.push({t:"Insights", h:insHtml, x:ins.map(i => "• " + i[1].replace(/<[^>]+>/g, "")).join("\n")});

  // próximos passos
  const sug = [];
  if (scale.length) sug.push(`Subir orçamento (10–20%) nas campanhas com CPL folgado: ${scale.slice(0,3).map(c => escape_(c.label)).join(", ")}.`);
  if (cut.length) sug.push(`Cortar/pausar o que drena verba: ${cut.slice(0,3).map(c => escape_(c.label)).join(", ")}.`);
  burning.slice(0,2).forEach(a => sug.push(`Pausar o anúncio "${escape_(a.label)}" (${M.money(a.spend)} investidos, ${a.sales === 0 ? "sem lead" : "CPL " + M.money(a.cac)}).`));
  if (promising.length) sug.push(`Duplicar e criar variações dos campeões de eficiência: ${promising.slice(0,3).map(a => escape_(a.label)).join(", ")}.`);
  if (over && cpcCeil != null) sug.push(`Trazer o CPC de ${M.money(cur.cpc)} pra ~${M.money(cpcCeil)} (criativo/público) ou subir a conversão do formulário pra ${M.pct1(convNeeded)}.`);
  if (!over) sug.push(`Escalar com cuidado (horizontal costuma segurar melhor o custo) e monitorar CPC/conversão a cada subida.`);
  if (!sug.length) sug.push("Sem ação urgente — manter monitoramento diário do CPL.");
  brief.push({t:"Próximos passos (sugestões)", h:`<ul>${sug.map(s => `<li>${s}</li>`).join("")}</ul>`, x:sug.map(s => "• " + s.replace(/<[^>]+>/g, "")).join("\n")});

  const briefText = `BRIEFING DO GESTOR — ${DATA.meta.title}\n${perLabel}\n\n`
    + brief.map(s => s.t.toUpperCase() + "\n" + s.x).join("\n\n")
    + `\n\n— gerado pela dashboard (${DATA.meta.generated_at_br})`;

  const briefingBlock = `
    <div class="briefing">
      <div class="bh">
        <h3>🔒 Briefing do gestor <span style="font-weight:500;font-size:12px;color:var(--ink-3)">— uso interno, pra você montar rápido. Não vai no print/cliente.</span></h3>
        <button class="rep-copy" id="repCopy">📋 Copiar briefing</button>
      </div>
      ${brief.map(s => `<div class="brief-sub"><div class="bt">${s.t}</div>${s.h}</div>`).join("")}
      <div class="brief-scratch"><div class="bt" style="font-size:12px;font-weight:700;color:var(--brand);margin-bottom:6px">✍️ SUAS ANOTAÇÕES (rascunho)</div>
        <textarea data-note="scratch" rows="3" placeholder="rascunho livre pra você…"></textarea></div>
    </div>`;

  document.getElementById("reportView").innerHTML = `
    <div class="report">
      <div class="rep-head">
        <div><h2>📄 Relatório — ${escape_(perLabel)}</h2>
          <p class="sub" style="margin-top:2px">Muda sozinho conforme o período · atualizado ${DATA.meta.generated_at_br}</p></div>
      </div>
      <p class="sub" style="margin:0 0 8px">⬇️ Blocos visuais limpos (é o que você manda em print pro cliente). Seu <b style="color:var(--ink-2)">briefing interno</b> fica no final.</p>
      ${secVisual}
      ${briefingBlock}
    </div>`;

  document.querySelectorAll("#reportView [data-note]").forEach(t => {
    const k = "rep-note-" + t.dataset.note;
    try { t.value = localStorage.getItem(k) || ""; } catch(e){}
    t.oninput = () => { try { localStorage.setItem(k, t.value); } catch(e){} };
  });
  document.querySelectorAll("#reportView [data-adlink]").forEach(inp => {
    const k = "rep-adlink-" + decodeURIComponent(inp.dataset.adlink);
    try { inp.value = localStorage.getItem(k) || ""; } catch(e){}
    inp.oninput = () => { try { localStorage.setItem(k, inp.value); } catch(e){} };
  });
  document.getElementById("repCopy").onclick = e => {
    const btn = e.currentTarget;
    let scratch = ""; try { scratch = (localStorage.getItem("rep-note-scratch") || "").trim(); } catch(_){}
    const full = briefText + (scratch ? "\n\nSUAS ANOTAÇÕES\n" + scratch : "");
    navigator.clipboard.writeText(full).then(() => { btn.textContent = "✅ Copiado!"; setTimeout(() => btn.textContent = "📋 Copiar briefing", 1800); })
      .catch(() => { btn.textContent = "❌ copie manualmente"; });
  };
}

    <div id="trafficNote" style="display:flex;gap:9px;align-items:flex-start;background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-2);margin-bottom:14px"></div>

    if (p === "all")   return setPeriod(m.date_min, m.date_max, "all");
    if (p === "today") return setPeriod(m.date_max, m.date_max, "today");
    if (p === "yesterday"){ const y = addDays(m.date_max, -1); const f = y < m.date_min ? m.date_min : y; return setPeriod(f, f, "yesterday"); }
    const n = +p;
    const from = addDays(m.date_max, -(n-1));
    setPeriod(from < m.date_min ? m.date_min : from, m.date_max, p);
  });
  const clampDates = () => {
    let f = document.getElementById("from").value, t = document.getElementById("to").value;
    if (!f || !t) return;
    if (f > t) [f,t] = [t,f];
    setPeriod(f, t, "custom");
  };
  document.getElementById("from").onchange = clampDates;
  document.getElementById("to").onchange = clampDates;

  document.getElementById("cmp").onclick = e => {
    STATE.compare = !STATE.compare;
    e.currentTarget.classList.toggle("on", STATE.compare);
    e.currentTarget.setAttribute("aria-pressed", STATE.compare);
    render();
  };
  document.querySelectorAll("[data-metric]").forEach(b => b.onclick = () => {
    STATE.metric = b.dataset.metric;
    document.querySelectorAll("[data-metric]").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  document.querySelector('[data-metric="spend"]').classList.add("on");

  // meta de investimento (guardada no navegador)
  const goalInput = document.getElementById("goal");
  try { const g = localStorage.getItem("funnel-goal"); if (g){ STATE.goal = +g; goalInput.value = g; } } catch(e){}
  goalInput.oninput = () => {
    const v = parseFloat(goalInput.value);
    STATE.goal = isFinite(v) && v > 0 ? v : null;
    try { STATE.goal ? localStorage.setItem("funnel-goal", STATE.goal) : localStorage.removeItem("funnel-goal"); } catch(e){}
    renderFunnel(aggregate(STATE.from, STATE.to));
  };

  // abas: Visão Geral (todas) · Tráfego Pago (meta-ads) · Relatório
  try { const tv = localStorage.getItem("funnel-tab"); if (["total","traffic","regions","report"].includes(tv)) STATE.tab = tv; } catch(e){}
  if (STATE.tab === "total" || STATE.tab === "traffic") STATE.mode = STATE.tab;
  document.querySelectorAll("[data-tab]").forEach(b => {
    b.setAttribute("aria-selected", b.dataset.tab === STATE.tab);
    b.onclick = () => {
      STATE.tab = b.dataset.tab;
      if (STATE.tab === "total" || STATE.tab === "traffic") STATE.mode = STATE.tab;
      try { localStorage.setItem("funnel-tab", STATE.tab); } catch(e){}
      document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === STATE.tab));
      refresh();
    };
  });

  setPeriod(m.date_min, m.date_max, "all");
}

/* ============================================================ boot */
async function load(){
  // Cache-bust duplo: o id do build invalida entre deploys, o timestamp
  // impede que um proxy sirva algo velho dentro do mesmo build.
  const url = `data.json?v=${BUILD_ID}&t=${Date.now()}`;
  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok) throw new Error(`data.json respondeu ${r.status}`);
  DATA = await r.json();
  shell();
}

const applyTheme = t => {
  document.documentElement.dataset.theme = t;
  document.getElementById("theme").textContent = t === "dark" ? "Claro" : "Escuro";
  try { localStorage.setItem("funnel-theme", t); } catch(e){}
};
document.getElementById("theme").onclick = () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
try {
  const saved = localStorage.getItem("funnel-theme");
  applyTheme(saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
} catch(e){ applyTheme("dark"); }

document.getElementById("reload").onclick = () => location.reload();

let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (DATA) render(); }, 180); });

load().catch(e => {
  document.getElementById("app").innerHTML =
    `<div class="panel err"><h2>Não consegui carregar os dados</h2>
     <p class="note" style="margin:8px 0 0">${escape_(e.message)}. Verifique se o build do GitHub Actions rodou sem erro.</p></div>`;
});
</script>
